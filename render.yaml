services:
  # -------------------------------------------------------------------------
  # 1. FastAPI Backend (Web Service)
  # -------------------------------------------------------------------------
  - type: web
    name: referral-guardian-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 10000

  # -------------------------------------------------------------------------
  # 2. Next.js Frontend (Web Service)
  # -------------------------------------------------------------------------
  - type: web
    name: referral-guardian-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        sync: false
